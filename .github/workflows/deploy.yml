name: Build and deploy to GitHub Pages

# Every push to the release branch goes live (the website and, through it, the
# desktop app, which plays the live site). It can also be run by hand (Actions →
# Run workflow). Pull requests build, as a check, without deploying. (Pages only
# accepts deployments from this branch: main is held back by the environment's rules.)
on:
  push:
    branches: [claude/bold-darwin-occlgg]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Supabase project for accounts, cloud saves and the online leaderboard. Both values
    # are public by design: the publishable key can only do what the database's row
    # level security allows (supabase/migrations).
    env:
      VITE_SUPABASE_URL: https://tvyztadurvkofztmxpmd.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fC7Y__Pz13lzDy5JE4dlIQ_rh_oicj-
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:single
      - name: Ship the single-file build next to the site
        run: cp dist-single/index.html dist/triad-offline.html
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
